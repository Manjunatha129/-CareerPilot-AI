# Server Configuration
server.port=8080

# Application Name
spring.application.name=careerpilot-api

# Database Configuration (Supports external PostgreSQL when available, defaults to embedded database with PostgreSQL compatibility)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:careerpilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable DDL schema.sql auto-run on boot for H2 compatibility
spring.sql.init.mode=never

# File Upload Multipart Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration
careerpilot.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
careerpilot.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Python AI Service Integration URL
careerpilot.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}

# Logging Level
logging.level.com.careerpilot=DEBUG
logging.level.org.springframework.web=INFO
