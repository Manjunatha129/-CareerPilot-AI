# Server Configuration (Render dynamic PORT support)
server.port=${PORT:8080}

# Application Name
spring.application.name=careerpilot-api

# Database Configuration (Supabase / Render PostgreSQL / External PostgreSQL, fallback to embedded H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:careerpilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER:org.h2.Driver}}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable DDL schema.sql auto-run on boot for H2 compatibility
spring.sql.init.mode=never

# File Upload Multipart Limits & Storage Directory
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
careerpilot.upload.dir=${UPLOAD_DIR:uploads/resumes}

# CORS Allowed Origins
careerpilot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000}

# JWT Configuration
careerpilot.app.jwtSecret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
careerpilot.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Python AI Service Integration URL
careerpilot.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}

# Logging Level
logging.level.com.careerpilot=DEBUG
logging.level.org.springframework.web=INFO

# External Job Provider API Credentials (Optional)
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
linkedin.client.id=${LINKEDIN_CLIENT_ID:}
linkedin.client.secret=${LINKEDIN_CLIENT_SECRET:}
indeed.client.id=${INDEED_CLIENT_ID:}
indeed.client.secret=${INDEED_CLIENT_SECRET:}
naukri.api.key=${NAUKRI_API_KEY:}
naukri.api.secret=${NAUKRI_API_SECRET:}
internshala.api.key=${INTERNSHALA_API_KEY:}
internshala.api.secret=${INTERNSHALA_API_SECRET:}


