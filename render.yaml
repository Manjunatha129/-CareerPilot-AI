# ========================================================
# CAREERPILOT AI - RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# ========================================================

databases:
  # 1. Managed PostgreSQL Database (with pgvector support)
  - name: careerpilot-db
    databaseName: careerpilot
    user: careerpilot_user
    plan: free
    region: singapore

services:
  # 1. FastAPI AI Microservice (Python 3.11)
  - type: web
    name: careerpilot-ai
    env: python
    plan: free
    region: singapore
    rootDir: ai-service/careerpilot-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # 2. Spring Boot Core Backend (Java 21 via Docker Container)
  - type: web
    name: careerpilot-api
    env: docker
    plan: free
    region: singapore
    rootDir: backend/careerpilot-api
    dockerfilePath: backend/careerpilot-api/Dockerfile
    envVars:
      - key: DATABASE_URL
        value: jdbc:postgresql://careerpilot-db:5432/careerpilot
      - key: DATABASE_USERNAME
        fromDatabase:
          name: careerpilot-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: careerpilot-db
          property: password
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
