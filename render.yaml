# ========================================================
# CAREERPILOT AI - RENDER DEPLOYMENT BLUEPRINT (render.yaml)
# ========================================================

services:
  # 1. FastAPI AI Microservice (Python 3.11)
  - type: web
    name: careerpilot-ai
    env: python
    region: singapore
    rootDir: ai-service/careerpilot-ai
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: EMBEDDING_DIMENSION
        value: "768"
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # 2. Spring Boot Core Backend (Java 21 via Docker Container)
  - type: web
    name: careerpilot-api
    env: docker
    region: singapore
    rootDir: backend/careerpilot-api
    dockerfilePath: backend/careerpilot-api/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/uploads
